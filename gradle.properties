org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=false

# Termux arm64: 官方 maven 的 aapt2 只有 x86_64, 直接指定 arm64 版可执行文件路径
# (值以 "aapt2" 结尾时 AGP 直接把它当可执行文件用, 不走 maven 解析)
# 获取方式: https://github.com/rendiix/termux-aapt/releases
android.aapt2FromMavenOverride=/data/data/com.termux/files/home/rendiix/prebuilt-binary/arm64/aapt2
# compileSdk 35 对 AGP 8.13 不是"已测试"版本, 抑制警告
android.suppressUnsupportedCompileSdk=35
