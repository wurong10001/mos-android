plugins {
    id 'com.android.application'
}

android {
    namespace 'org.wurong.mos'
    compileSdk 35

    defaultConfig {
        applicationId 'org.wurong.mos'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
        ndk {
            // 按需增减; 只保留一个 ABI 可显著加快构建
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    // NativeActivity 方案: 没有 Java/Kotlin 源码
    buildFeatures {
        buildConfig false
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
