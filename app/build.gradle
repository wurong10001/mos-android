plugins {
    id 'com.android.application'
}

android {
    namespace 'org.wurong.mos'
    // compileSdk 30: rendiix arm64 版 aapt2 (2.19) 读不了 API 35+ 的 android.jar
    compileSdk 30
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'org.wurong.mos'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    // native 库预编译 (tools/build_native_arm64.sh) 后放入 jniLibs,
    // 不走 externalNativeBuild (Termux 上没有 arm64 host 的 NDK 工具链)
    sourceSets {
        main {
            jniLibs.srcDir 'src/main/jniLibs'
        }
    }

    buildFeatures {
        buildConfig false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
